<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HealWell</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="../index.html" class="logo">Heal<span>Well</span></a>
      <div class="navbar-actions">
        <span class="nav-link-text">New here?</span>
        <a href="signup.html" class="btn btn-secondary">Sign Up</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Log in to manage your appointments</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" required>
          <span class="error-message" id="password-error"></span>
        </div>

        <span class="form-message" id="form-message"></span>

        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Login</button>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
